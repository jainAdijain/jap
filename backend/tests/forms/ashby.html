<!doctype html>
<html><head><meta charset="utf-8"><title>SRE</title></head><body>
<form class="ashby-application-form" method="post" action="/submit" enctype="multipart/form-data">
<div><label for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" required></div>
<div><label for="_systemfield_email">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" required></div>
<div><label for="q_notice">What is your notice period?</label><input id="q_notice" name="q_notice" required></div>
<fieldset><legend>Are you legally authorized to work in India?</legend>
<label><input type="radio" name="q_auth" value="yes" required> Yes</label>
<label><input type="radio" name="q_auth" value="no"> No</label></fieldset>
<div><label><input type="checkbox" name="q_consent"> I agree to the privacy notice</label></div>
<div class="h-captcha" data-sitekey="x" data-captcha></div>
<button type="submit">Submit Application</button></form></body></html>
