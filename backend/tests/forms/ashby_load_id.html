<!doctype html>
<html><head><meta charset="utf-8"><title>Postgres</title></head><body>
<!-- Like ClickHouse's Ashby form (JAP-16): each radio group is named anew on every load, a
     random id and then the question's own name, as are the EEO questions. Its options are
     labelled by id. -->
<form class="ashby-application-form" method="post" action="/submit" enctype="multipart/form-data">
  <div class="ashby-application-form-field-entry">
    <label class="_required_x ashby-application-form-question-title" for="_systemfield_name">Name</label>
    <input id="_systemfield_name" name="_systemfield_name" required>
  </div>
  <div class="ashby-application-form-field-entry" data-q="question_17759507004" data-options="0,1,2,3,4,5+">
    <label class="_required_x ashby-application-form-question-title">How many years of Postgres professional experience do you have?</label>
  </div>
  <div class="ashby-application-form-field-entry" data-q="_systemfield_eeoc_gender" data-options="Male,Female,Decline to self-identify">
    <label class="ashby-application-form-question-title">Gender</label>
  </div>
  <button type="submit">Submit Application</button>
</form>
<script>
  const load = crypto.randomUUID();
  for (const entry of document.querySelectorAll('[data-q]')) {
    const name = load + '_' + entry.dataset.q;
    entry.dataset.options.split(',').forEach((text, i) => {
      const id = name + '-labeled-radio-' + i;
      entry.insertAdjacentHTML('beforeend',
        `<span><input type="radio" id="${id}" name="${name}" value="${text}"><label for="${id}">${text}</label></span>`);
    });
  }
</script></body></html>
