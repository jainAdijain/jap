<!doctype html>
<html><head><meta charset="utf-8"><title>Backend Engineer</title></head><body>
<h1>Backend Engineer</h1>
<form id="application_form" method="post" action="/submit" enctype="multipart/form-data">
  <label for="first_name">First Name <span class="asterisk">*</span></label>
  <input type="text" id="first_name" name="job_application[first_name]" aria-required="true">
  <label for="last_name">Last Name <span class="asterisk">*</span></label>
  <input type="text" id="last_name" name="job_application[last_name]" aria-required="true">
  <label for="email">Email <span class="asterisk">*</span></label>
  <input type="text" id="email" name="job_application[email]" aria-required="true">
  <label for="phone">Phone</label>
  <input type="text" id="phone" name="job_application[phone]">
  <label for="resume">Resume/CV <span class="asterisk">*</span></label>
  <input type="file" id="resume" name="job_application[resume]" aria-required="true" style="display:none">
  <label for="why">Why do you want to work here? <span class="asterisk">*</span></label>
  <textarea id="why" name="job_application[answers][0][text_value]" maxlength="500" aria-required="true"></textarea>
  <label for="hear">How did you hear about us?</label>
  <select id="hear" name="job_application[answers][1][option]">
    <option value="">Please select</option><option value="1">LinkedIn</option><option value="2">Friend</option>
  </select>
  <input type="hidden" name="token" value="x">
  <input type="submit" value="Submit Application">
</form></body></html>
