name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: app (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jap
          POSTGRES_PASSWORD: jap
          POSTGRES_DB: jap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jap" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      # Tests create and migrate their own jap_test database next to this one.
      DATABASE_URL: postgresql+psycopg://jap:jap@localhost:5432/jap
      JAP_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q

  ui:
    name: ui (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/compose.yaml config --quiet
