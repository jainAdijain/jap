# JAP's own Cloudflare Tunnel (PRD H1, H6): one outbound connection from the Mac, no router
# ports. The public hostname lives in the Cloudflare dashboard (README, Hosting):
#   jap.tutorial.monster -> http://host.docker.internal:5373  (the live stack's Caddy)
# That one UI port is all that is published; never the API port, Inngest, Postgres, Adminer
# or Ollama (H2), and never the local stack.
# Run through the Makefile: make tunnel-start (reads TUNNEL_TOKEN from .env.tunnel).
name: jap-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?put the tunnel token in .env.tunnel}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
